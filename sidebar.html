<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 12px sans-serif;
        background: #1c1b22;
        color: #fbfbfe;
      }
      body {
        display: flex;
        flex-direction: column;
        position: relative;
      }
      [hidden] {
        display: none !important;
      }

      /* ---- dark tab bar (always dark, independent of the page) ---- */
      #bar {
        display: flex;
        align-items: stretch;
        gap: 4px;
        padding: 4px 4px 0;
        background: #1c1b22;
        color-scheme: dark;
      }
      #mode {
        width: auto;
        min-width: 26px;
        padding: 0 4px;
      }
      #tabs {
        display: flex;
        flex: 1;
        min-width: 0;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab img {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border-radius: 3px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        max-width: 140px;
        padding: 5px 6px 5px 10px;
        border-radius: 6px 6px 0 0;
        border-bottom: 2px solid transparent;
        background: #2b2a33;
        color: #bfbfc9;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .tab span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab:hover {
        background: #38373f;
        color: #fff;
      }
      .tab.active {
        background: #42414d;
        color: #fff;
        border-bottom-color: #6c8cff;
      }
      .tab.dragging {
        opacity: 0.4;
      }
      .tab.drop-before {
        box-shadow: inset 2px 0 0 #6c8cff;
      }
      .tab.drop-after {
        box-shadow: inset -2px 0 0 #6c8cff;
      }
      .tab .x {
        all: unset;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        line-height: 1;
        color: inherit;
        opacity: 0.6;
        cursor: pointer;
      }
      .tab .x:hover {
        opacity: 1;
        background: #5b5a66;
      }
      .ctl {
        all: unset;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 26px;
        margin-bottom: 2px;
        border-radius: 6px;
        background: #2b2a33;
        color: #bfbfc9;
        cursor: pointer;
      }
      .ctl:hover {
        background: #42414d;
        color: #fff;
      }

      /* ---- add / edit panel ---- */
      #form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        background: #25242b;
        border-top: 1px solid #42414d;
        color-scheme: dark;
      }
      #formTitle {
        font-weight: bold;
      }
      #form input {
        padding: 5px 6px;
        border: 1px solid #52525e;
        border-radius: 4px;
        background: #1c1b22;
        color: #fbfbfe;
        font: inherit;
      }
      #form input:focus {
        outline: none;
        border-color: #6c8cff;
      }
      #form .row {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }
      #form button {
        padding: 4px 12px;
        border: 1px solid #52525e;
        border-radius: 4px;
        background: #2b2a33;
        color: #fbfbfe;
        font: inherit;
        cursor: pointer;
      }
      #form button:hover {
        background: #42414d;
      }
      #form button[type="submit"] {
        background: #3b6bff;
        border-color: #3b6bff;
      }
      #form button[type="submit"]:hover {
        background: #5a82ff;
      }

      /* ---- page area ---- */
      #frames {
        flex: 1;
        position: relative;
        border-top: 1px solid #42414d;
      }
      #frames iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #frames iframe.hidden {
        display: none;
      }
      #empty {
        padding: 24px 12px;
        text-align: center;
        color: #8f8f9d;
      }

      #toast {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #42414d;
        color: #fbfbfe;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="tabs" role="tablist"></div>
      <button class="ctl" id="add" title="Add tab">+</button>
      <button class="ctl" id="mode" title="Toggle mode">&#128295;</button>
      <button class="ctl" id="reload" title="Reload current tab">
        &#8635;
      </button>
    </div>

    <form id="form" hidden autocomplete="off">
      <div id="formTitle"></div>
      <input id="nameIn" placeholder="Name (optional)" maxlength="30" />
      <input
        id="urlIn"
        placeholder="http://192.168.1.20:8096"
        spellcheck="false"
      />
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save">Save</button>
      </div>
    </form>

    <div id="frames">
      <div id="empty" hidden>No tabs yet. Press + to add one.</div>
    </div>
    <div id="toast" hidden></div>
    <script src="sidebar.js"></script>
  </body>
</html>
