name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint extension
        run: npx --yes web-ext lint

      - name: Build extension zip
        run: npx --yes web-ext build --overwrite-dest --ignore-files "preview-pictures/**" "AMO-listing.md" ".github/**"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: web-ext-artifacts/*.zip